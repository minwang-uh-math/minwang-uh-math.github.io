<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url != '/' %}{{ page.title | escape }} | {% endif %}Min Wang</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="{{ '/images/monogram.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header>
    <a class="site-name" href="{{ '/' | relative_url }}">Min Wang</a>
    <nav aria-label="Main navigation">
      {% for item in site.data.navigation.main %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}
    </nav>
  </header>
  <main id="main" tabindex="-1">
    {% unless page.url == '/' %}<h1>{{ page.title }}</h1>{% endunless %}
    {{ content }}
  </main>
  <footer>© {{ site.time | date: '%Y' }} Min Wang · <a href="mailto:mwang55@cougarnet.uh.edu">mwang55@cougarnet.uh.edu</a></footer>
</body>
</html>
